# java.util.logging configuration for the node the end to end tests run in-process.
# Picked up from the classpath by nxt.util.Logger; console only, so no logs/ directory
# is created. Lower both levels to FINE to see the APDUs and the Speculos events.

handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = [%1$tT %4$s] %5$s%6$s%n
