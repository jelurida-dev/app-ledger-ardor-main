# Node configuration for the end to end tests. Overrides nxt-default.properties, which
# ships inside the ardorlib jar. Read by nxt.BlockchainTest relative to the working
# directory, which is why the tests must run from the tests-e2e directory.

# The test JVM installs no SecurityManager, so the node must not expect one.
nxt.disableSecurityPolicy=true

# Talk to the hardware wallet.
nxt.enableLedgerWallet=true

# Reach it through Speculos instead of USB HID. nxt.ledger.speculosPort defaults to 9999.
nxt.ledger.speculosHostname=localhost
