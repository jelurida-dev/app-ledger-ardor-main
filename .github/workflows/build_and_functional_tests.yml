name: Build and run functional tests using ragger through reusable workflow

# This workflow will build the app and then run functional tests using the Ragger framework upon Speculos emulation.
# It calls a reusable workflow developed by Ledger's internal developer team to build the application and upload the
# resulting binaries.
# It then calls another reusable workflow to run the Ragger tests on the compiled application binary.
#
# While this workflow is optional, having functional testing on your application is mandatory and this workflow and
# tooling environment is meant to be easy to use and adapt after forking your application

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behavior if the test snapshots are different than expected.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "compiled_app_binaries"

  ragger_tests:
    name: Run standalone ragger tests using the reusable workflow
    needs: build_application
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: "compiled_app_binaries"
      regenerate_snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
      run_for_devices: '["nanox", "nanosp", "stax"]'

  job_e2e_tests:
    name: E2E tests
    needs: build_application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      options: --entrypoint /bin/bash
    
    steps:
      - name: Install dependencies
        run: apt update && apt install -qy default-jdk git

      - name: Download app binary
        uses: actions/download-artifact@v7
        with:
          name: "compiled_app_binaries"
          path: /tmp/app/build/

      - name: Run speculos in the background
        run: |
          /speculos/speculos.py --display headless --seed "opinion change copy struggle town cigar input kit school patient execute bird bundle option canvas defense hover poverty skill donkey pottery infant sense orchard" /tmp/app/build/nanos/bin/app.elf 2>/tmp/speculos.log &
          echo $! >/tmp/speculos.pid
          # Wait for Speculos to be ready
          for i in {1..30}; do
            if nc -z localhost 40000 2>/dev/null; then
              echo "Speculos is ready"
              break
            fi
            echo "Waiting for Speculos... ($i/30)"
            sleep 1
          done

      - name: Run tests with Ardor node
        run: |
          git clone --branch ledger-tests https://sargue@bitbucket.org/sargue/ardor-ledger-test.git /ardor
          cd /ardor
          ./run-unit-tests.sh com.jelurida.ardor.integration.wallet.ledger.application.LedgerSpeculosSuite

      - name: Kill speculos
        run: kill -9 $(cat /tmp/speculos.pid)

      - name: Upload Speculos log
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: speculos-log
          path: /tmp/speculos.log

      - name: Upload Ardor log
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ardor-log
          path: /ardor/logs/ardor.0.log
